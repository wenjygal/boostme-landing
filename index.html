<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Boost Me</title>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<script type="module">
  const { useEffect, useRef, useState } = React;

  const res = await fetch("./BoostMeLanding.jsx");
  let source = await res.text();
  source = source.replace(/^import\s*\{[^}]*\}\s*from\s*["']react["'];?\s*/m, "");
  source = source.replace(/export default function/, "function");
  source += "\nreturn BoostMeLanding;";

  const { code } = Babel.transform(source, {
    presets: ["react"],
    filename: "BoostMeLanding.jsx",
  });

  const BoostMeLanding = new Function("React", "useEffect", "useRef", "useState", code)(
    React, useEffect, useRef, useState
  );

  ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(BoostMeLanding));
</script>
</body>
</html>
